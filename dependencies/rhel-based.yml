---
- name: Update dnf cache.
  ansible.builtin.dnf:
    update_cache: true
  become: true

- name: Install dependencies.
  ansible.builtin.package:
    name:
      - '@Development Tools'
      - gcc-gfortran
      # Fedora doesn't install this with the Development Tools group.
      - gcc-g++
      - clang
    state: present
  become: true
